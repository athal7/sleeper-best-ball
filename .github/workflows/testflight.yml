name: TestFlight

# Manual only: every run uploads a build to App Store Connect and notifies testers.
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      KEY_ID: ${{ vars.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.sleeperbestball.app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Test projection engine
        run: swift test --package-path ios/BestBallKit

      - name: Configure credentials
        env:
          API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          missing=0
          for name in TEAM_ID KEY_ID ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set"
              missing=1
            fi
          done
          if [ -z "$API_KEY" ]; then
            echo "::error::Repository secret APPSTORE_API_PRIVATE_KEY is not set"
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1

          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          printf '%s' "$API_KEY" > "$key_dir/AuthKey_$KEY_ID.p8"
          chmod 600 "$key_dir/AuthKey_$KEY_ID.p8"
          echo "ASC_KEY_PATH=$key_dir/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      # Optional: supply a distribution certificate as base64 in BUILD_CERTIFICATE_BASE64.
      # Without it, Xcode creates the certificate and provisioning profiles from the API key.
      - name: Install distribution certificate
        env:
          P12_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "No certificate supplied; relying on -allowProvisioningUpdates."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$P12_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$P12_PASSWORD" "$keychain"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12" 2>/dev/null \
            || printf '%s' "$P12_BASE64" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$P12_PASSWORD" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/BestBall.xcodeproj \
            -scheme BestBall \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BestBall.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            BB_BUNDLE_ID="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION="1.0"

      - name: Export and upload to TestFlight
        run: |
          cp ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          plutil -replace teamID -string "$TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BestBall.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
