[package]
name = "bestball-core"
version = "0.1.0"
edition = "2021"
description = "Shared trade/waiver/scoring engine for the Best Ball iOS app and Streamlit app"

[lib]
name = "bestball_core"
# staticlib + cdylib for the two shells, rlib for the Rust tests.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
